[project]
name = "ascon-competition"
version = "0.1.0"
description = "Eris-compatible ASCON strategy and offline verification tools"
requires-python = ">=3.11,<3.13"
dependencies = ["eris-agent-sdk"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.5", "basedpyright==1.39.10"]

[tool.uv]
package = false

[tool.uv.sources]
eris-agent-sdk = { git = "https://github.com/NyxFoundation/eris-agent-simulator", rev = "e5b93b651bba2384aedfa891cecbf7b64d05b88b", subdirectory = "sdk-py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"tools.py" = ["S603", "S607"] # Commands are fixed argv lists, never a shell.
"validation.py" = ["S603", "S607"] # Fixed commands for the local simulator and Docker inspection.

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["agents", "tools.py", "validation.py"]
venvPath = "."
venv = ".venv"
extraPaths = ["agents/eris-adaptive-v1"]
