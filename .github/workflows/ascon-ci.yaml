name: ASCON offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11.16"
          enable-cache: true
      - name: Install pinned SDK and test tools
        run: uv sync --project competition --python 3.11.16 --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test strategy, JSONL protocol, lint and types without credentials
        run: make ascon-check
      - name: Prepare pinned official runtime
        run: make ascon-prepare
      - name: Install official runtime dependencies
        working-directory: .eris/eris-agent-simulator
        run: npm ci --ignore-scripts
      - name: Official static checks and bundle
        run: make ascon-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ascon-candidate-bundle
          path: dist/ascon/
          retention-days: 14
