name: Publish reviewed certifi trust fix

on:
  push:
    branches: ["maintenance/ascon-certifi-publish-20261021"]

permissions:
  contents: read

concurrency:
  group: ascon-certifi-publish-20261021
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'code-up-matrix/ASCON-AGENT'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ascon-performance-fix
          fetch-depth: 1
      - name: Apply the reviewed patch and verify the complete tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6cdba97970103e24eddb707555697cc514d566ee"
          cat > "$RUNNER_TEMP/ascon-certifi.patch" <<'ASCON_REVIEWED_CERTIFI_PATCH'
          diff --git a/docs/ASCON_VALIDATION.md b/docs/ASCON_VALIDATION.md
          index f106119..f0c9fc7 100644
          --- a/docs/ASCON_VALIDATION.md
          +++ b/docs/ASCON_VALIDATION.md
          @@ -2,7 +2,7 @@
           
           **The repaired frozen candidate passed all 60 public scenarios and all 12 additional-seed scenarios under observed 2 CPU / 4 GiB Docker limits.** Performance improved, but the candidate still trails the starter on average. Live LLM revision and organizer acceptance remain unverified.
           
          -Validated October 20, 2026. Tested repository commit: `8cadc87a0c728ee509f77d2a4ee5a6c1a3d1ed8c`. Eris/Python SDK pin: `e5b93b651bba2384aedfa891cecbf7b64d05b88b`. Later documentation commits do not change the validated agent source hashes.
          +Validated October 20, 2026. Tested repository commit: `8cadc87a0c728ee509f77d2a4ee5a6c1a3d1ed8c`. Eris/Python SDK pin: `e5b93b651bba2384aedfa891cecbf7b64d05b88b`. Later documentation and retained-application dependency commits do not change the validated agent source hashes.
           
           ## Full market and resource evidence
           
          @@ -85,6 +85,12 @@ The [pinned official scorer](https://github.com/NyxFoundation/eris-agent-simulat
           | Repository lint, types, import contracts, vulnerability audit and secret scan | Passed |
           | Official bundle | Agent bytes, upstream license, absence of environment files and SHA-256 verified |
           
          +### Dependency audit follow-up
          +
          +The publication audit detected [GHSA-6q48-6c7w-9gw2](https://github.com/certifi/python-certifi/security/advisories/GHSA-6q48-6c7w-9gw2), published while the market validation was running. The retained application used certifi 2026.7.22, whose trust bundle included an affected emSign root. Its requirement and lockfile now select **certifi 2026.10.19**, the advised fixed release; no other package version changed.
          +
          +The fixed package was uploaded on October 20, so a dated certifi-only cutoff admits it while the default one-week freshness rule still applies to other dependencies. Remove that dated exception on or after **October 27, 2026** to restore certifi's normal one-week delay. The competition lockfile does not contain certifi, and the validated strategy/SDK/bundle are unchanged. The existing audit suppressions were not expanded.
          +
           The [validated candidate artifact](https://github.com/code-up-matrix/ASCON-AGENT/actions/runs/39478740739/artifacts/12291507824) contains the submission ZIP and its manifest. The **inner submission ZIP** SHA-256 is:
           
           ```text
          diff --git a/pyproject.toml b/pyproject.toml
          index f639216..4fcefbf 100644
          --- a/pyproject.toml
          +++ b/pyproject.toml
          @@ -30,7 +30,7 @@ dependencies = [
               "json-repair>=0.61.1",
               "ijson>=3.5.1",
               "pypdf>=6.19.0",
          -    "certifi>=2026.5.20",
          +    "certifi>=2026.10.19", # GHSA-6q48-6c7w-9gw2: remove compromised emSign trust root
               "brotli>=1.2.0",                                        # aiohttp's optional `br` decoder; see [tool.deptry] DEP002
               "backports-zstd>=1.7.0 ; python_full_version < '3.14'", # aiohttp's optional `zstd` decoder; stdlib from 3.14 on
               "curl-cffi>=0.15.0",
          @@ -72,6 +72,9 @@ dev = [
           [tool.uv]
           required-version = ">=0.12.10"
           exclude-newer = "1 week"
          +# Emergency CA-trust fix (GHSA-6q48-6c7w-9gw2), admitting only releases before this cutoff.
          +# Remove this dated certifi exception on/after 2026-10-27 to restore its one-week delay.
          +exclude-newer-package = { certifi = "2026-10-20T20:00:00Z" }
           # Transitive through openai-agents: fix GHSA-84m7-p3x7-pcfv without adding
           # an unused direct dependency or changing the repository's freshness policy.
           constraint-dependencies = ["mcp>=1.30.0"]
          diff --git a/uv.lock b/uv.lock
          index 977024c..94050af 100644
          --- a/uv.lock
          +++ b/uv.lock
          @@ -17,6 +17,9 @@ resolution-markers = [
           exclude-newer = "0001-01-01T00:00:00Z" # This has no effect and is included for backwards compatibility when using relative exclude-newer values.
           exclude-newer-span = "P1W"
           
          +[options.exclude-newer-package]
          +certifi = "2026-10-20T20:00:00Z"
          +
           [manifest]
           constraints = [{ name = "mcp", specifier = ">=1.30.0" }]
           excludes = ["gitpython"]
          @@ -522,11 +525,11 @@ wheels = [
           
           [[package]]
           name = "certifi"
          -version = "2026.7.22"
          +version = "2026.10.19"
           source = { registry = "https://pypi.org/simple" }
          -sdist = { url = "https://files.pythonhosted.org/packages/a3/c2/24167ea9858356b47a87a50d39908bfdb72ceeefe0041586e704e5376b3a/certifi-2026.7.22.tar.gz", hash = "sha256:741e2c3b351ddf169a738da9f2c048608ff7f2c5cc02f1ebc6b118bb090d5d55", size = 138112, upload-time = "2026-07-22T03:35:12.644Z" }
          +sdist = { url = "https://files.pythonhosted.org/packages/a6/bd/1436c50cc46699de0230fbaacc1d1de7bfec413176099949e9d5112e88f2/certifi-2026.10.19.tar.gz", hash = "sha256:035c1e85572b141bf1c3a3eff0e33a8eb74917522f2559075ff8d2fea780a1ae", size = 137598, upload-time = "2026-10-20T02:24:16.604Z" }
           wheels = [
          -    { url = "https://files.pythonhosted.org/packages/0b/a7/71ac2cff56fec219ed242bb11b8efb69fcc4bec75db06fb7bfe35de520e6/certifi-2026.7.22-py3-none-any.whl", hash = "sha256:62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775", size = 136983, upload-time = "2026-07-22T03:35:11.276Z" },
          +    { url = "https://files.pythonhosted.org/packages/c4/51/29046e48f693c54e5b7412216d447a1d8362c9653148d98c02cdf65fa733/certifi-2026.10.19-py3-none-any.whl", hash = "sha256:42d35340cc5b9ba78e818ddbff0c5b1c2b779de448a340fd1b989f5fa8670e1b", size = 136464, upload-time = "2026-10-20T02:24:15.072Z" },
           ]
           
           [[package]]
          @@ -2926,7 +2929,7 @@ requires-dist = [
               { name = "asknews", specifier = ">=0.11.2" },
               { name = "backports-zstd", marker = "python_full_version < '3.14'", specifier = ">=1.7.0" },
               { name = "brotli", specifier = ">=1.2.0" },
          -    { name = "certifi", specifier = ">=2026.5.20" },
          +    { name = "certifi", specifier = ">=2026.10.19" },
               { name = "curl-cffi", specifier = ">=0.15.0" },
               { name = "defusedxml", specifier = ">=0.7.1" },
               { name = "exa-py", specifier = ">=1.16.0" },
          ASCON_REVIEWED_CERTIFI_PATCH
          git apply --check "$RUNNER_TEMP/ascon-certifi.patch"
          git apply "$RUNNER_TEMP/ascon-certifi.patch"
          git diff --check
          git add -- pyproject.toml uv.lock docs/ASCON_VALIDATION.md
          test "$(git write-tree)" = "2751967738ea67b13150ae04e79936001ea39164"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update certifi after emSign trust-store advisory"
          git push origin HEAD:refs/heads/feat/ascon-performance-fix
